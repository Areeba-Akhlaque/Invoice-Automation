# DIRECTIVE — global settings & policy for the invoice automation.
# The "what": declarative configuration the Orchestration layer reads.

google:
  spreadsheet_id: "175sJ_48ScDzpFj_MnGeHoMsKaAQV4qbGiLHjEjrofuM"
  # Local (interactive) OAuth fallback — used only when no service account is set.
  client_secret_glob: "client_secret_*.json"
  token_file: "token.json"
  scopes:
    - "https://www.googleapis.com/auth/spreadsheets"
    # Needed by hours_source: calendar. Adding a scope invalidates an existing
    # token.json -- run `python tools/reauth.py` (and refresh the CI secret).
    - "https://www.googleapis.com/auth/calendar.readonly"

invoice:
  client: "David Roberts Consulting"
  prefix: "DRC"            # invoice tabs look like DRC-0059
  number_pad: 4            # DRC-0059 -> 4 digits
  due_days: 7              # DATE DUE = INVOICE DATE + 7
  fixed_hours: 86.5        # the "=173/2" standard for full-time contractors

# Advance-billing schedule (Cherry's model): bill 1-15 and 16-EOM, issued in
# advance (issue = period start + 7). The draft is generated a few days ahead so
# there is time to review before the issue date; the issue date itself is computed
# from the period, so moving these days does not move it.
# Project descriptions. A recurring meeting is not a deliverable: the names repeat
# every fortnight, so listing them makes two invoices look alike and tells the
# client nothing. Segments matching these are removed from the time-entry text
# BEFORE it is summarised and before the missing/repetitive check runs — so
# someone whose whole period was meetings is flagged for review (with a cell note)
# instead of being described with a plausible-looking list of meeting names.
#
# Matched with fullmatch against one segment of an entry, case-insensitively, after
# whitespace/bullets/trailing punctuation are stripped. Entries are split on ";",
# "|" and ". - " first. Name-pair meetings ("Roman : Jaime", "Victor / Roman") are
# recognised by shape and need no pattern here.
#
# Keep this list to things that are ONLY a meeting. Anything naming a subject
# ("IMPORTANT REVIEW: Crisis Classification Rollout", "Aetna and Humana breakouts")
# is real work and must stay.
descriptions:
  drop_segments:
    - '(dev team )?all[ -]?hands( call)?'
    - '(pvragon )?co[ -]?working'
    - '(pvragon )?team building'
    - 'jaime tb'
    - 'billing team (sync|weekly)'
    - 'support review'
    - '(echo ?1 )?office hours?'
    - 'echo ?1 (data )?team sync'
    - 'ride care ops ([+&]|and) data leads'
    - 'strategy\s*-\s*pvragon'
    - 'crisis( classification)? (session|call)'
    - 'crisis changes session'
    - 'driver trip log review and planning'
    - 'review'                                  # Saymond logs a bare "Review."
    - '1:1( with .+| meetings?)?'
    - '.*opportunities\s*(&|and)\s*career'
    # Time off is not billable work and must not be described as if it were.
    # "comp\w+ holiday" rather than "company holiday": it is typed by hand and
    # has come through as "Compnay Holiday".
    - '(paid off day|comp\w+ holiday|holiday|pto|day off|vacation|sick)\b.*'

  # People who turn up in entry text but are not billed on this invoice. Roster
  # names are picked up automatically; these are the rest. A leading run of names
  # is stripped from an entry so "JP:Bradd Crisis Review" reads as "Crisis Review"
  # — the subject is the billable thing, not who attended. Only COLLEAGUES belong
  # here: a client's name ("Harris", "Saif") is part of the work.
  people: ["Jaime", "Vic", "Macie", "Trever", "Toni", "Maranda", "Cherry", "Areeba"]

  # Applied to the FINISHED description, not to the entries. A meeting named inside
  # a prose entry ("Daily support call and team meetings. Ticket scoping...") is one
  # segment, so segment filtering cannot reach it, and the model writes it into the
  # cell however firmly the prompt says not to. These phrases are cut from the
  # generated line and the item is dropped if nothing is left of it.
  scrub_phrases:
    - '\b(and|with)?\s*(the\s+)?team meetings?\b'
    - '\b(and|with)?\s*(the\s+)?all[ -]?hands( call| meeting)?s?\b'
    - '\becho ?1 office hours?\b'
    - '\boffice hours?\b'
    # The company prefix goes WITH the label: scrubbing only "coworking" left a
    # bare "Pvragon" sitting in the cell as though it were a deliverable.
    - '\b(pvragon )?co[ -]?working\b'
    - '\b(pvragon )?team building\b'
    - '\b1:1s?\b'
    - '\bstand[ -]?ups?\b'
    - '\bdaily (sync|huddle)\b'
    - '\bdev team\b'

schedule:
  # The day BEFORE each review (reviews are on the 5th and the 20th), so the draft
  # is already there to be reviewed. Keep in step with the cron in
  # .github/workflows/invoice.yml — this list is what --auto checks, the cron is
  # what wakes it up, and only one of them failing to move means no draft at all.
  run_days: [4, 19]        # day-of-month the automation generates a draft
  issue_offset_days: 7     # invoice issue date = period start + this

# Calendar-based hours (hours_source: calendar). Mirrors the Apps Script that
# populates the calendar-sync sheet, so the numbers agree with it.
calendar:
  timezone: "America/Los_Angeles"
  skip_all_day_events: true      # Home / trips / OOO are 1440-minute noise
  # Where one working day ends. James works past midnight, and that evening's
  # block is that evening's work -- so a day runs 4am to 4am, and the period
  # 1-15 Oct means 1 Oct 04:00 through 16 Oct 04:00.
  day_start_hour: 4
  # Two events on the same minutes are billed twice, on the client's instruction:
  # meetings overrun their slots and the marked times understate that. The run
  # still reports the amount so a figure counted either way can be reconciled.
  count_overlapping_time: true
  # gCal colour id -> project label, copied from that sheet's ColorMapping tab.
  # roster.yaml refers to a person's billable label (calendar_project).
  color_map:
    1: "[Lavender]"
    2: "Ride Care"
    3: "Revolve"
    4: "Pvragon"
    5: "Medical"
    6: "[Tangerine]"
    7: "Lifestyle"
    8: "Non-Attributable"
    9: "Conformational Aesthetics"
    10: "MtG"
    11: "[Tomato]"

# Kimai: this invoice bills ONE client's work, but people log time against more
# than one project (Ride Care 2110 h and Pvragon 835 h over Sep-Oct). Without
# this filter another client's hours and descriptions would land on the invoice.
# Leave blank to take every project, as it used to.
kimai:
  project: "Ride Care"

gemini:
  model: "gemini-2.5-flash-lite"   # free-tier model (higher daily quota than 2.5-flash)
  request_delay_seconds: 8         # gap between calls when not batching

# Cell layout of an invoice tab (matches DRC-0059). Line-item rows are located
# dynamically by matching the person name in the person column, so only the
# header/total cells are hard-coded here.
layout:
  invoice_number: "F5"
  invoice_date: "F6"
  start_date: "F8"
  end_date: "F9"
  project_description: "B13"
  person_col: "B"
  project_col: "C"
  hours_col: "D"
  rate_col: "E"
  amount_col: "F"
  # Billable rows ONLY — must equal the range inside the subtotal's SUM formula.
  # validate_layout() checks this against the live sheet on every run and aborts
  # if the tab has drifted (row 16 is the header, 34+ are the totals block).
  # These follow the tab: resolve_layout re-detects them if rows are added or
  # removed, warns, and carries on — keep them current anyway so the warning stops.
  line_items_scan_rows: [17, 30]
  subtotal_cell: "F32"             # =SUM(F17:F30)
  discount_cell: "F33"             # =F32-<contract amount>
  total_cell: "D35"                # =F32-F33 (next to the TOTAL label in D34)

# Pass-through / third-party rows are detected from the tab itself: any named row
# in the billable range that is not a roster person keeps its carried amount unless
# --passthrough overrides it. Nothing to list here.
