name: DRC Invoice

# Cloud scheduling — runs on GitHub's servers, no laptop needed.
#
# Cron is UTC and does NOT observe DST, so midnight Pacific has no single cron:
# it is 08:00 UTC in winter (PST) and 07:00 UTC in summer (PDT). 08:00 is the safe
# choice — midnight Pacific in winter, 1am in summer, and the 5th/20th either way.
# 07:00 would drift to 11pm on the 4th/19th in winter, i.e. the wrong day.
on:
  schedule:
    - cron: "0 8 5,20 * *"    # 5th & 20th, 12am PST / 1am PDT -> bills 1-15 / 16-EOM
  workflow_dispatch:           # manual "Run workflow" button
    inputs:
      write:
        description: "Write the tab to the sheet (otherwise preview only)"
        type: boolean
        default: false
      start:
        description: "Period start YYYY-MM-DD (optional; auto from today if blank)"
        required: false
      end:
        description: "Period end YYYY-MM-DD (optional)"
        required: false
      cap:
        description: "Contract amount (final total). Discount = subtotal - this. Blank = carry over the previous invoice's."
        required: false
      desc_window:
        description: 'Per-person description window, e.g. "Victor Cheung=2026-08-10:2026-08-24"'
        required: false
      allow_duplicate_period:
        description: "Proceed even if the previous tab already covers this period"
        type: boolean
        default: false

jobs:
  build-invoice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Inputs and secrets go through the environment, never interpolated into the
      # shell: `${{ inputs.x }}` inside a run: block is a command-injection hole.
      - name: Restore Google credentials
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON || secrets.GOOGLE_TOKEN }}
          # Must be visible here too: this step decides whether ANY credential
          # exists, and a service-account-only setup has no GOOGLE_TOKEN_JSON.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_TOKEN_JSON:-}" ] && [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::No Google credentials: set GOOGLE_SERVICE_ACCOUNT_JSON (preferred) or GOOGLE_TOKEN_JSON."
            exit 1
          fi
          if [ -n "${GOOGLE_TOKEN_JSON:-}" ]; then
            printf '%s' "$GOOGLE_TOKEN_JSON" > token.json
            # Fail here, readably, rather than mid-run on a 403: adding
            # calendar.readonly invalidated every token minted before it.
            python tools/check_token_scopes.py
          fi

      - name: Generate invoice
        env:
          # Accept a few common secret-name variations so naming doesn't break it.
          KIMAI_URL: ${{ secrets.KIMAI_URL || secrets.KIMAI_API_URL }}
          KIMAI_TOKEN: ${{ secrets.KIMAI_TOKEN || secrets.KIMAI_API_TOKEN || secrets.KIMAI_API }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EVENT_NAME: ${{ github.event_name }}
          IN_WRITE: ${{ inputs.write }}
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
          IN_CAP: ${{ inputs.cap }}
          IN_DESC_WINDOW: ${{ inputs.desc_window }}
          IN_ALLOW_DUP: ${{ inputs.allow_duplicate_period }}
        run: |
          set -euo pipefail
          args=(--yes)
          if [ "$EVENT_NAME" = "schedule" ] || [ "${IN_WRITE:-}" = "true" ]; then
            args+=(--write)
          fi
          if [ -n "${IN_START:-}" ]; then args+=(--start "$IN_START"); fi
          if [ -n "${IN_END:-}" ]; then args+=(--end "$IN_END"); fi
          if [ -n "${IN_CAP:-}" ]; then args+=(--cap "$IN_CAP"); fi
          if [ -n "${IN_DESC_WINDOW:-}" ]; then args+=(--desc-window "$IN_DESC_WINDOW"); fi
          if [ "${IN_ALLOW_DUP:-}" = "true" ]; then args+=(--allow-duplicate-period); fi
          echo "Running: python run.py ${args[*]}"
          python run.py "${args[@]}"

      - name: Remove restored token
        if: always()
        run: rm -f token.json
